<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS - Task 1 - Register Page</title>
</head>

<body>
    <label for="userName">Name:</label> &nbsp;
    <input type="text" id="userName" name="userName" required><br><br>

    <label for="age">Age:</label> &nbsp;&nbsp;&nbsp;&nbsp;
    <input type="number" id="age" name="age" required><br><br>

    <label for="gender">Gender:</label>
    <label for="male"><img src="../images/1.jpg"></label>
    <input type="radio" id="male" name="gender" value="Male" required>
    <label for="female"><img src="../images/2.jpg"></label>
    <input type="radio" id="female" name="gender" value="Female" required><br><br>

    <label for="favColor">Select your Favorite Color:</label>
    <select id="favColor" name="favColor">
        <option value="Red">Red</option>
        <option value="Green">Green</option>
        <option value="Blue">Blue</option>
    </select> <br><br>

    <input type="submit" id="registerBtn" value="Register">
    <script src="../scripts/CookiesLib.js"></script>
    <script src="../scripts/registerScript.js"></script>
</body>

</html>
